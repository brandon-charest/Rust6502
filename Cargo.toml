[package]
name = "rust-6502-emulator"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Brandon Charest"]

[lib]
name = "rust_6502_emulator"
path = "src/lib.rs"

[dependencies]
bitflags = "2.10.0"

[lints.clippy]
# Allow uppercase acronyms for 6502 instruction mnemonics (LDA, STA, ADC, etc.)
upper_case_acronyms = "allow"

[lints.rust]
dead_code = "allow"
